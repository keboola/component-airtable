[project]
name = "component-airtable"
version = "0.1.0"
description = "Extractor for Airtable tables"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "freezegun>=1.5.1",
    "keboola.component>=1.9.0",
    "keboola-csvwriter>=1.0.1",
    "keboola-http-client>=1.0.0",
    "keboola-utils>=1.1.0",
    "mock>=5.0.2",
    "pyairtable==1.4.0",
    "pydantic>=2.0.0",
    "typeguard>=3.0.2",
]

[dependency-groups]
dev = [
    "keboola.datadirtest>=2.0.0",
    "pytest>=9.0.0",
    "ruff>=0.15.2",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
"keboola.component" = { index = "testpypi" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP"]
